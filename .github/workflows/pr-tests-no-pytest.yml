name: Tests

on:
  pull_request:
    branches: [ develop ]

jobs:
  tests:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        python-version: ['3.8', '3.12']
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install "git+https://git@github.com/Avaiga/taipy.git@fix/sqlrepo-integration-test" statsmodels Flask-Testing scikit-learn
        timeout-minutes: 30

      - name: Run test
        run:  python -m tpt.churn_classification.churn_classification
        timeout-minutes: 30
